<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d47a1"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00bcd4"/>
      <stop offset="100%" stop-color="#1565c0"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="974" cy="390" r="30" fill="#1565c0" opacity="0.19"/>
    <circle cx="1083" cy="463" r="87" fill="#1565c0" opacity="0.15"/>
    <circle cx="1166" cy="708" r="38" fill="#1565c0" opacity="0.17"/>
    <circle cx="951" cy="49" r="97" fill="#1565c0" opacity="0.07"/>
    <circle cx="207" cy="466" r="58" fill="#1565c0" opacity="0.13"/>
    <circle cx="600" cy="592" r="53" fill="#1565c0" opacity="0.06"/>
    <rect x="70" y="-85" width="68" height="38" rx="8" fill="#0d47a1" opacity="0.14" transform="rotate(14, 29, 685)"/>
    <rect x="812" y="-4" width="29" height="52" rx="8" fill="#0d47a1" opacity="0.06" transform="rotate(18, 271, 719)"/>
    <rect x="114" y="93" width="96" height="91" rx="8" fill="#0d47a1" opacity="0.07" transform="rotate(29, 400, 633)"/>
    <rect x="392" y="529" width="42" height="43" rx="8" fill="#0d47a1" opacity="0.11" transform="rotate(27, 47, 513)"/>
    <rect x="189" y="93" width="84" height="26" rx="8" fill="#0d47a1" opacity="0.10" transform="rotate(29, 788, 656)"/>
    <rect x="1038" y="99" width="89" height="45" rx="8" fill="#0d47a1" opacity="0.09" transform="rotate(2, 978, 496)"/>
    <rect x="1121" y="211" width="47" height="57" rx="8" fill="#0d47a1" opacity="0.15" transform="rotate(30, 416, 365)"/>
    <rect x="1166" y="231" width="28" height="38" rx="8" fill="#0d47a1" opacity="0.09" transform="rotate(15, 257, -39)"/>
    <polygon points="1098,614 1139,696 1057,696" fill="#1565c0" opacity="0.10"/>
    <polygon points="923,-27 1016,159 830,159" fill="#1565c0" opacity="0.09"/>
    <polygon points="642,76 712,216 572,216" fill="#1565c0" opacity="0.07"/>
    <polygon points="462,230 561,428 363,428" fill="#1565c0" opacity="0.04"/>

  <!-- Wave at bottom -->
  <path d="M0,564 C360,597 840,531 1200,564 L1200,630 L0,630Z" fill="#1565c0" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    서울 홈페이지 빌더 업체
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    서울 — 홈페이지 빌더
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#00bcd4" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#00bcd4" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    서울 서울 홈페이지 빌더 업체 — 홈페이지 빌더
  </text>
</svg>